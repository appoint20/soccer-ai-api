# Render Blueprint (soccer-ai-api)
# Deploy everything in one go: https://render.com/docs/blueprints
#
# IMPORTANT: this file is only read when the services are created from a
# Blueprint ("New > Blueprint" in the dashboard). A service created by hand
# ignores it completely, keeps whatever environment variables the dashboard
# holds, and therefore falls back to the SQLite default in appsettings.json —
# which then dies on a container filesystem with
# "SQLite Error 14: unable to open database file".
#
# If the deploy log says the provider is Sqlite, the Blueprint is not in effect.
services:
  # 1. Main .NET 10 API Service (HTTP only — no background sync)
  - type: web
    name: soccer-ai-api
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: starter
    region: frankfurt # Change to your preferred region (must match for all services)
    envVars:
      - key: PORT
        value: 10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AISERVICE__BASEURL
        value: "https://openrouter.ai/api/v1"
      # Must be a model OpenRouter still lists, and it must be free unless
      # someone has decided to spend. Two defaults have gone wrong here: first
      # stealth/ox-alpha, a time-limited free preview OpenRouter withdrew, after
      # which every narrative request failed; then anthropic/claude-sonnet-5,
      # which worked and quietly spent €10 of credit in a day — 82 fixtures at
      # about €0.12 each, since the worker sets no model variable of its own and
      # takes whatever ships. Paying is now an explicit act: set this to a paid
      # slug on the ONE service that should spend, and nothing else will.
      # NOTE: this blueprint value does not update an existing service — change
      # AISERVICE__DEFAULTMODEL in the dashboard too, or delete it there so
      # appsettings.json applies.
      - key: AISERVICE__DEFAULTMODEL
        value: "nvidia/nemotron-3-super-120b-a12b:free"
      # An OpenRouter key: starts with "sk-or-v1-". This used to be ZAI_API_KEY,
      # which must never be sent to OpenRouter. Credential lookup is now scoped
      # to the configured provider; a Z.ai key cannot act as a fallback here.
      - key: OPENROUTER_API_KEY
        sync: false # Set this manually in the Render dashboard
      # Admin key for /api/automation/* (header: X-API-Key). Any string of 16+
      # characters; the app hashes it on startup and never logs it. Added to the
      # hashes in appsettings.json rather than replacing them, so existing keys
      # keep working. Comma-separate to allow several during a rotation.
      - key: ADMIN_API_KEY
        sync: false # Set this manually in the Render dashboard
      # ── Supabase (identity) ──
      # The URL is public; the two keys are not. service_role bypasses row-level
      # security entirely and is used only for deleting an account.
      - key: SUPABASE__URL
        value: "https://knvspbrwljvgzfklrvxt.supabase.co"
      - key: SUPABASE__SERVICEROLEKEY
        sync: false # Set this manually in the Render dashboard
      # Only for projects that still sign HS256 with the legacy project JWT
      # secret. Newer projects publish a JWKS and need nothing here.
      - key: SUPABASE__JWTSECRET
        sync: false
      # ── PostgreSQL (provisioned below) is the primary database ──
      - key: DATABASE__PROVIDER
        value: Postgres
      - key: CONNECTIONSTRINGS__POSTGRESCONNECTION
        fromDatabase:
          name: soccer-ai-db
          property: connectionString
    # No disk: Postgres holds the data. A SQLite file on a container filesystem
    # is erased on every deploy, and the .db files are gitignored so one would
    # not be in the image anyway. Load the historical data once from a laptop:
    #   soccer-ai-tools migrate-data --sqlite=<local.db> --postgres=<external url>

  # 2. Sync agent (dedicated worker — fixtures/odds sync, analysis precompute)
  - type: worker
    name: soccer-ai-worker
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile.worker
    plan: starter
    region: frankfurt
    envVars:
      - key: DOTNET_ENVIRONMENT
        value: Production
      - key: API_FOOTBALL_KEY
        sync: false # Set this manually in the Render dashboard
      # OpenRouter key ("sk-or-v1-…") for the narrative step — see the note on
      # the web service. A Z.ai key here fails every request with 401.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE__PROVIDER
        value: Postgres
      - key: CONNECTIONSTRINGS__POSTGRESCONNECTION
        fromDatabase:
          name: soccer-ai-db
          property: connectionString
      - key: SYNC__INTERVALMINUTES
        value: "120"
      - key: SYNC__INTERVALANCHORMINUTE
        value: "20"
      - key: SYNC__STARTUPSYNCTHRESHOLDHOURS
        value: "2"
      - key: SYNC__ODDSREFRESHINTERVALHOURS
        value: "2"
      - key: SYNC__ODDSCAPTUREINTERVALMINUTES
        value: "120"
      - key: SYNC__LIVESCOREINTERVALSECONDS
        value: "7200"
      - key: SYNC__LIVESTATSREFRESHMINUTES
        value: "120"
      - key: SYNC__ODDSCAPTUREHORIZONHOURS
        value: "72"
      - key: SYNC__ODDSFINALAPPROACHHOURS
        value: "6"
      # Model training now runs inside the sync pipeline, between the fixture
      # fetch it learns from and the recompute that serves it. It self-throttles
      # on the published generation's age, so 24 syncs a day still cost one
      # training run — raise this if the instance struggles with the fit.
      - key: HYBRIDMODEL__RETRAININTERVALHOURS
        value: "24"
      # The AI narrative step. With this off, SyncPipeline skips the step and
      # marks it done, so every fixture's `ai` block stays permanently empty
      # ("", confidence 0, has_decision_layer false) and the app has no analysis
      # text to show. It also needs OPENROUTER_API_KEY set in the dashboard
      # above. Missing or wrong-provider credentials fail the AI step and leave
      # an error in sync status. An earlier API-Football failure can prevent this
      # step from being reached at all; inspect the last completed step too.
      #
      # This costs money per sync: it is an LLM call per upcoming fixture.
      - key: SYNC__GENERATEAINARRATIVES
        value: "true"

databases:
  - name: soccer-ai-db
    databaseName: soccer_ai
    user: postgres
    plan: free
    region: frankfurt
