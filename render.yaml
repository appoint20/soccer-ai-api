# Render Blueprint (soccer-gpt-api)
# Deploy everything in one go: https://render.com/docs/blueprints
services:
  # 1. Main .NET 10 API Service
  - type: web
    name: soccer-ai-api
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: starter
    region: frankfurt # Change to your preferred region (must match for all services)
    envVars:
      - key: PORT
        value: 10000
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AISERVICE__BASEURL
        value: "https://api.z.ai/api/paas/v4/chat/completions"
      - key: AISERVICE__DEFAULTMODEL
        value: "glm-5.1"
      - key: ZAI_API_KEY
        sync: false # Set this manually in the Render dashboard
      - key: CONNECTIONSTRINGS__DEFAULTCONNECTION
        value: "Data Source=/app/data/soccer.db"
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: soccer-ai-db
    databaseName: soccer_ai
    user: postgres
    plan: free
    region: frankfurt
