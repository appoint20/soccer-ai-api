# Soccer Predictor Settings
# Application configuration for the prediction system

app:
  name: "Soccer Predictor"
  version: "1.0.0"
  description: "European Soccer Match Prediction API"

# Feature Engineering Parameters
features:
  lookback_matches: 5
  min_matches_for_stats: 3
  form_window: 5
  
# Prediction Thresholds
thresholds:
  over25:
    high_confidence: 0.70
    medium_confidence: 0.55
    min_probability: 0.50
  btts:
    high_confidence: 0.75
    medium_confidence: 0.60
    min_probability: 0.50
  result:
    min_probability: 0.40

# Model Configuration
model:
  # Poisson model parameters
  poisson:
    max_goals: 10
    dixon_coles_correction: true
  
  # ML model parameters (for future use)
  ml:
    test_size: 0.2
    random_state: 42

# Data Quality Settings
data_quality:
  min_matches_per_team: 5
  max_missing_stats_ratio: 0.3
  validate_team_names: true
  log_team_name_warnings: true

# Caching Settings
cache:
  team_stats_ttl_hours: 24
  h2h_cache_ttl_hours: 24
  predictions_cache_ttl_hours: 1
