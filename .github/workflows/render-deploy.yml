name: CI/CD Pipeline for Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Update to latest desired version
          
      - name: Restore dependencies
        run: dotnet restore src/soccer-ai-api/soccer-ai-api.csproj

      - name: Build
        run: dotnet build src/soccer-ai-api/soccer-ai-api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/soccer-ai-unit-tests/soccer-ai-unit-tests.csproj --configuration Release --no-build

