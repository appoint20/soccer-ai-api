name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        # Usually Render connects directly to GitHub. If you are using a Deploy Hook URL:
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$deploy_url" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "If your Render service is connected directly to this repository with 'Auto-Deploy' enabled, you do not need this GitHub Action."
            echo "Otherwise, add the Deploy Hook URL from your Render service settings to GitHub Secrets."
            exit 1
          fi
          echo "Triggering Render deployment..."
          curl -s -X POST $deploy_url
