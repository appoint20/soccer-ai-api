name: Build and Deploy to Google Cloud

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: "soccer-ai-250226" # Replace with your actual GCP Project ID if different
  REGION: "europe-west3" # Your specified TF region
  IMAGE_NAME: "soccer-ai-api"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"
          # Alternatively, use Workload Identity Federation:
          # workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          # service_account: 'my-service-account@my-project.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Extract DB Hash for Cache Busting
        id: dbhash
        run: |
          echo "hash=$(sha256sum src/soccer-ai-api/data/soccer.db | cut -d' ' -f1)" >> $GITHUB_OUTPUT



      - name: Build and Push Docker Image
        run: |
          # Build relative to the dockerfile but context in the root directory
          docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${IMAGE_NAME}:${{ github.sha }} -f Dockerfile .
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${IMAGE_NAME}:${{ github.sha }}

      - name: Upload SQLite Database to GCS
        run: |
          # Upload local database snapshot to the dedicated Cloud Storage Bucket
          gsutil cp src/soccer-ai-api/data/soccer.db gs://soccer-ai-db-${PROJECT_ID}/soccer.db

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${IMAGE_NAME} \
            --image ${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${IMAGE_NAME}:${{ github.sha }} \
            --region ${REGION} \
            --project ${PROJECT_ID} \
            --allow-unauthenticated \
            --execution-environment gen2 \
            --add-volume=name=gcs-db,type=cloud-storage,bucket=soccer-ai-db-${PROJECT_ID} \
            --add-volume-mount=volume=gcs-db,mount-path=/app/data \
            --set-secrets="APIFOOTBALL_API_KEY=APIFOOTBALL_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,Jwt__Secret=JWT_SECRET:latest" \
            --set-env-vars="ASPNETCORE_ENVIRONMENT=Production" \
            --service-account="appoint@${PROJECT_ID}.iam.gserviceaccount.com" \
            --memory=2Gi \
            --cpu=1 \
            --timeout=600s
