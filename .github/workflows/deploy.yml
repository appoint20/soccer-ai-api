name: Build and Deploy to Google Cloud

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: "soccer-ai-250226" # Replace with your actual GCP Project ID if different
  REGION: "europe-west3" # Your specified TF region
  IMAGE_NAME: "soccer-ai-api"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"
          # Alternatively, use Workload Identity Federation:
          # workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          # service_account: 'my-service-account@my-project.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Extract DB Hash for Cache Busting
        id: dbhash
        run: |
          echo "hash=$(sha256sum src/soccer-ai-api/data/soccer.db | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        run: |
          # Build relative to the dockerfile but context in the root directory
          docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${IMAGE_NAME}:${{ github.sha }} -f Dockerfile .
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${IMAGE_NAME}:${{ github.sha }}

      - name: Upload SQLite Database to GCS
        run: |
          # Assuming you have a bucket setup via TF mapping (e.g. soccer-data-[project])
          # Replace 'soccer-ai-db-bucket' with your actual bucket name
          gsutil cp src/soccer-ai-api/data/soccer.db gs://soccer-ai-db-bucket/soccer.db

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="docker_image_api=${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${IMAGE_NAME}:${{ github.sha }}"
