name: 'Soccer AI CI/CD Pipeline'

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_GAR_LOCATION || 'europe-west3' }}
  REPOSITORY: ${{ secrets.GCP_GAR_REPOSITORY || 'soccer-ai' }}
  IMAGE: soccer-ai-api

jobs:
  terraform:
    name: 'Infrastructure (Terraform)'
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Plan
      working-directory: ./terraform
      run: terraform plan -input=false

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' && github.event_name == 'push'
      working-directory: ./terraform
      run: terraform apply -auto-approve -input=false

  build-test-push:
    name: 'Build, Test, and Push'
    needs: terraform
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore soccer-gpt-api.sln

      - name: Build
        run: dotnet build soccer-gpt-api.sln --no-restore -c Release

      - name: Test
        run: dotnet test soccer-gpt-api.sln --no-build -c Release --verbosity normal

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Docker Auth
        uses: 'docker/login-action@v3'
        with:
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'
          username: '_json_key'
          password: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" .
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"

  deploy:
    name: 'Deploy to Cloud Run'
    needs: build-test-push
    runs-on: ubuntu-latest
    steps:
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'soccer-gpt-api'
          region: '${{ env.GAR_LOCATION }}'
          image: '${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}'
          flags: '--allow-unauthenticated'
          env_vars: |
            ASPNETCORE_ENVIRONMENT=Production
          secret_envs: |
            POSTGRES_CONNECTION_STRING=POSTGRES_CONNECTION_STRING:latest
            APIFOOTBALL_API_KEY=APIFOOTBALL_API_KEY:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
